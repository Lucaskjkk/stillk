[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stillk"
version = "0.1.2"
description = "A scaffolding CLI for ML, DL, LLM, RAG and AI Agents projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Stillk Contributors" }
]
keywords = ["ml", "deep-learning", "llm", "rag", "ai-agents", "cli", "scaffolding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/stillk"
Repository = "https://github.com/your-org/stillk"
Issues = "https://github.com/your-org/stillk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
stillk = "stillk.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
